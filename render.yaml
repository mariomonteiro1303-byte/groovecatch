services:
  - type: web
    name: groovecatch-cloud-pilot
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: GROOVECATCH_CLOUD
        value: "1"
      - key: GROOVECATCH_ACCESS_USER
        value: admin
      - key: GROOVECATCH_ACCESS_PASSWORD
        sync: false
      - key: GROOVECATCH_SECRET_KEY
        generateValue: true
      - key: GROOVECATCH_ADS_ADMIN_PASSWORD
        sync: false
